name: Build and Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify (Linux)
        if: runner.os == 'Linux'
        run: ./mvnw -B -ntp clean verify
      - name: Verify (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B -ntp clean verify
